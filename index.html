<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hangout</title>
<meta name="theme-color" content="#e2603f">
<meta name="description" content="Chat, make group chats and video call with your friends.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hangout">
<style>
  :root{--bg:#fbf6ef;--card:#fff;--ink:#2b2420;--muted:#7b6f66;--line:#eadfd3;--accent:#e2603f;--accent-ink:#fff;--soft:#fbe9e1;--ok:#2f8f6a;--bad:#d9534f;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06)}
  @media (prefers-color-scheme: dark){ :root{--bg:#1b1715;--card:#25201d;--ink:#f3ebe4;--muted:#a8998d;--line:#3a322d;--accent:#f07a58;--soft:#3a2a24;--shadow:0 1px 2px rgba(0,0,0,.3)} }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,textarea,select{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  header.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
  header.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.4px;flex:1}
  header.top h1 span{color:var(--accent)}
  main{flex:1;padding:0 14px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .rw{flex-wrap:wrap}
  .spacer{flex:1}
  .name{font-weight:650}
  .muted,.uh{color:var(--muted);font-size:13px}
  .small{font-size:12px}
  .btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn.block{width:100%}
  .ghost{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .ghost.sm{padding:5px 11px;font-size:13px}
  .link{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px;font-size:14px}
  .link.muted{color:var(--muted)}
  input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;outline:none;margin:5px 0}
  input.field:focus,textarea.field:focus{border-color:var(--accent)}
  label.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-top:8px}
  .msg{font-size:13px;margin-top:6px;min-height:1px} .msg.bad{color:var(--bad)} .msg.good{color:var(--ok)}
  .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative;overflow:hidden;font-size:16px;text-transform:uppercase}
  .av.sm{width:30px;height:30px;font-size:13px} .av.lg{width:88px;height:88px;font-size:40px}
  .av.emo{background:var(--soft)!important;font-size:22px} .av.sm.emo{font-size:16px} .av.lg.emo{font-size:48px}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .avwrap{position:relative;display:inline-block;flex:none}
  .avwrap.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2fbf71;border:2px solid var(--card)}
  .empty{text-align:center;color:var(--muted);padding:34px 12px}
  .empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
  nav.tabs .in{display:flex;max-width:640px;width:100%}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  nav.tabs button .ic{font-size:22px;filter:grayscale(.6);opacity:.8}
  nav.tabs button.on{color:var(--accent)} nav.tabs button.on .ic{filter:none;opacity:1}
  .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center}
  .list .item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
  .list .item:first-child{border-top:0}
  .list .item .mid{flex:1;min-width:0}
  .list .item .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
  .gem{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
  /* auth */
  .auth{max-width:420px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 18px 30px}
  .logo{font-size:64px;text-align:center}
  .auth h1{text-align:center;font-size:32px;margin:6px 0 2px}
  .auth h1 span{color:var(--accent)}
  .seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:16px 0}
  .seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:650;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  /* chat view */
  .chatview{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .chathead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
  .chathead .mid{flex:1;min-width:0} .chathead .uh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
  .m{display:flex;gap:8px;align-items:flex-end;max-width:85%}
  .m.mine{align-self:flex-end;flex-direction:row-reverse}
  .m .b{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
  .m.mine .b{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .m .who{font-size:12px;color:var(--muted);margin:6px 0 2px 4px}
  .m.mine .who{display:none}
  .m .b.big{font-size:38px;background:none;border:0;padding:0 4px}
  .m .t{font-size:10px;color:var(--muted);margin:0 4px 2px}
  .m .del{border:0;background:none;color:var(--muted);cursor:pointer;opacity:0;font-size:12px}
  .m:hover .del,.m:focus-within .del{opacity:1}
  .sys{align-self:center;font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:999px;margin:6px 0}
  .composer{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
  .composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 14px;outline:none}
  .tool{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;flex:none;display:grid;place-items:center;padding:0}
  .pop{position:absolute;bottom:62px;left:10px;right:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;max-height:240px;overflow-y:auto;z-index:25}
  .pop .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
  .pop .grid button{border:0;background:none;font-size:24px;padding:4px 0;border-radius:8px;cursor:pointer}
  .pop .grid button:hover{background:var(--soft)}
  .sect{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,14,10,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
  @media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:20px} }
  .sheet h2{margin:0 0 6px}
  .pick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
  .pick:hover{background:var(--soft)}
  .pick input{width:18px;height:18px;accent-color:var(--accent)}
  .emojis{display:flex;flex-wrap:wrap;gap:4px}
  .emojis button{border:2px solid transparent;background:none;font-size:24px;border-radius:10px;cursor:pointer;padding:2px 4px}
  .emojis button.on{border-color:var(--accent);background:var(--soft)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
  .galb{border:3px solid transparent;border-radius:50%;padding:0;background:none;cursor:pointer;aspect-ratio:1;overflow:hidden}
  .galb img{width:100%;height:100%;display:block}
  .galb.on{border-color:var(--accent)}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  .chip.on{border-color:var(--accent);background:var(--soft)}
  .themes{display:flex;flex-wrap:wrap;gap:6px}
  .themebtn{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:13px;color:var(--ink)}
  .themebtn.on{border-color:var(--accent)}
  .tsw{width:22px;height:22px;border-radius:50%}
  .hero{text-align:center}
  .hero .nm{font-size:22px;font-weight:800;margin-top:8px}
  .stat{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-size:14px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;display:none;max-width:90%;text-align:center}
  #ringBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));z-index:30}
  .ring{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid #2fbf71;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .ring .ic{font-size:26px;animation:shake 1s infinite}
  .ring .btn{background:#2fbf71}
  @keyframes shake{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-15deg)}20%,40%{transform:rotate(15deg)}50%{transform:rotate(0)}}
  .install{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:12px}
  .steps{padding-left:20px;margin:6px 0} .steps li{margin:4px 0}
  .banner{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  /* themes */
</style>
</head>
<body>
<div id="loading" class="empty" style="padding-top:30vh"><div class="logo">💬</div>Loading The Hangout…</div>

<!-- ===== Sign in / sign up ===== -->
<section id="authScreen" class="auth" hidden>
  <div class="logo">💬</div>
  <h1>The <span>Hangout</span></h1>
  <div class="muted" style="text-align:center">Chat, group chats and video calls with your friends.</div>
  <div class="seg"><button id="tabLogin" class="on">Log in</button><button id="tabSignup">Sign up</button></div>
  <form id="authForm" class="card">
    <label class="lbl" for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label class="lbl" for="pw">Password</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
    <div id="pw2wrap" hidden><label class="lbl" for="pw2">Type it again</label><input class="field" id="pw2" type="password" autocomplete="new-password" minlength="6"></div>
    <div class="msg bad" id="authMsg"></div>
    <button class="btn block" id="authBtn" type="submit" style="margin-top:10px">Log in</button>
    <div class="row" style="justify-content:center;margin-top:8px"><button type="button" class="link" id="forgotBtn">Forgot password?</button></div>
  </form>
  <div class="muted small" style="text-align:center">🛡️ Never share your password. Pick one you don't use anywhere else.</div>
</section>

<!-- ===== First-time profile setup ===== -->
<section id="setupScreen" class="auth" hidden>
  <div class="logo">👋</div>
  <h1>Welcome!</h1>
  <div class="muted" style="text-align:center">Let's set up your profile.</div>
  <form id="setupForm" class="card" style="margin-top:14px">
    <label class="lbl" for="setName">Your name (what friends see)</label>
    <input class="field" id="setName" maxlength="40" required placeholder="e.g. Sam">
    <label class="lbl" for="setUser">Pick a username (friends add you with this)</label>
    <div class="row"><span style="font-weight:700;color:var(--muted)">@</span><input class="field" id="setUser" maxlength="20" required placeholder="sam_123" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="muted small">3–20 letters, numbers or _</div>
    <label class="lbl">Pick a picture</label>
    <div class="gallery" id="setGallery"></div>
    <div class="msg bad" id="setupMsg"></div>
    <button class="btn block" type="submit" style="margin-top:12px">Let's go! 🎉</button>
  </form>
</section>

<!-- ===== Main app ===== -->
<div class="app" id="mainApp" hidden>
  <header class="top"><h1 id="pageTitle">The <span>Hangout</span></h1><button class="ghost sm" id="installBtn" hidden>📲 Install</button></header>
  <main>
    <div id="verifyBanner" class="banner" hidden></div>
    <section id="pg-chats"></section>
    <section id="pg-friends" hidden></section>
    <section id="pg-calls" hidden></section>
    <section id="pg-me" hidden></section>
  </main>
  <nav class="tabs"><div class="in">
    <button data-pg="chats" class="on"><span class="ic">💬</span>Chats<span class="badge" id="bChats" hidden></span></button>
    <button data-pg="friends"><span class="ic">👯</span>Friends<span class="badge" id="bFriends" hidden></span></button>
    <button data-pg="calls"><span class="ic">📹</span>Calls<span class="badge" id="bCalls" hidden></span></button>
    <button data-pg="me"><span class="ic">🙂</span>Me</button>
  </div></nav>
</div>

<div id="chatView" class="chatview" hidden></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="ringBar"></div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
